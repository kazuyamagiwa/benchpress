name: Test and Publish causal_automata

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'workflow/rules/structure_learning_algorithms/causal_automata/**'
      - '.github/workflows/test_causal_automata.yml'
  pull_request:
    paths:
      - 'workflow/rules/structure_learning_algorithms/causal_automata/**'
      - '.github/workflows/test_causal_automata.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/causal_automata

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # Always publish :latest so rule.smk can resolve it on PR CI too.
            type=raw,value=latest

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: workflow/rules/structure_learning_algorithms/causal_automata
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  snakemake-test:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Apptainer (Singularity)
        run: |
          set -euo pipefail
          # Ubuntu 24.04 GHA runners block unprivileged user namespaces by default,
          # which makes Apptainer SIF→sandbox extraction fail with EPERM.
          sudo tee /etc/sysctl.d/90-userns.conf >/dev/null <<'EOF'
          kernel.apparmor_restrict_unprivileged_userns = 0
          kernel.unprivileged_userns_clone = 1
          EOF
          sudo sysctl --system || true

          sudo apt-get update
          sudo apt-get install -y software-properties-common \
            uidmap squashfuse fuse2fs fuse-overlayfs squashfs-tools
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          # Prefer the setuid helper package when available for nested mounts on GHA.
          sudo apt-get install -y apptainer apptainer-suid || sudo apt-get install -y apptainer
          command -v singularity || sudo ln -sf "$(command -v apptainer)" /usr/local/bin/singularity
          apptainer --version
          # Registry-scoped login only — do not set APPTAINER_DOCKER_* globally,
          # or Docker Hub pulls (bpimages/*) fail with HTTP 400 on bearer token.
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            -u "${{ github.actor }}" --password-stdin docker://ghcr.io

      - name: Set up Mamba and Conda
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: benchpress-env
          condarc: |
            channels:
              - conda-forge
              - bioconda
            channel_priority: strict
          create-args: >-
            python=3.10
            snakemake
          init-shell: bash

      - name: Run Snakemake End-to-End Test
        shell: bash -el {0}
        run: |
          # Container-only path: causal_automata and Benchpress data/graph rules use
          # Apptainer images (no local conda envs required for this smoke config).
          snakemake --cores 2 --use-singularity \
            --singularity-args "--userns" \
            --configfile config/causal_automata_test.json
